appId: com.dheaven.code.nova
productName: DHeaven Code NOVA
copyright: Copyright © 2026 DHeaven
directories: { output: release, buildResources: build }
files: [dist/**/*, package.json, "!dist/**/*.map"]
asar: true
win:
  target: [nsis, portable, zip]
  icon: build/icon.png
  artifactName: "DHeaven-Code-NOVA-${version}-${arch}-${target}.${ext}"
nsis: { oneClick: false, perMachine: false, allowToChangeInstallationDirectory: true, createDesktopShortcut: true }
portable: { artifactName: "DHeaven-Code-NOVA-${version}-portable.exe" }
linux: { target: [AppImage, tar.gz], category: Development, icon: build/icon.png }
