appId: com.dheaven.code.nova
productName: DHeaven Code NOVA
executableName: dheaven-code-nova
copyright: Copyright © 2026 DHeaven
directories: { output: release, buildResources: build }
files: [dist/**/*, package.json, "!dist/**/*.map"]
asar: true
# The extension host runs as a plain Node process with --permission; keep it a real file on disk.
asarUnpack: [dist/main/extension-host.cjs]
extraResources:
  - from: ../../target/release/
    to: .
    filter: [novad, novad.exe]
  # First-party bundled extensions (installed on startup through the normal validation path).
  - from: ../../extensions/bundled/
    to: bundled-extensions
artifactName: "DHeaven-Code-NOVA-${version}-${os}-${arch}.${ext}"
win:
  target: [nsis, portable, zip]
  icon: build/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  artifactName: "DHeaven-Code-NOVA-${version}-setup-${arch}.${ext}"
portable: { artifactName: "DHeaven-Code-NOVA-${version}-portable-${arch}.${ext}" }
linux:
  target: [AppImage, tar.gz]
  category: Development
  icon: build/icon.png
  syncDesktopName: true
